name: Multi-language application
on:
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Setup
    steps:
      - uses: actions/checkout@v4

      # -------------------------
      # Node.js / JavaScript setup
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # choose LTS version

      - name: Install Node.js dependencies
        run: npm install

      # -------------------------
      # Python setup
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # -------------------------
      # PHP setup
      # -------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'  # choose your version
          extensions: mbstring, intl, curl  # add any required extensions

      - name: Install PHP dependencies
        run: composer install

      # -------------------------
      # Simulate long-running task (example)
      # -------------------------
      - name: Simulate long-running task
        continue-on-error: true
        run: sleep 200
